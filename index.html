<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Catalog piese Cavan C1</title>
<meta name="theme-color" content="#0a7d74">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Cavan C1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>

/* Layout: EPC-style workbench — top bar with search, left tree of systems → groups, main pane = exploded view (clickable callouts) + parts table */
:root{
  --bg:#eef1f3; --panel:#ffffff; --ink:#152028; --muted:#5d6b75; --line:#d5dce1;
  --accent:#0a7d74; --accent-ink:#ffffff; --accent-soft:#dff1ee; --hit:#fff1c2; --chip:#e8edf0; --danger:#b42318;
  --f-display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1519; --panel:#172026; --ink:#e3eaee; --muted:#93a3ad; --line:#2a363e;
  --accent:#3cc4b4; --accent-ink:#06201d; --accent-soft:#16332f; --hit:#4a3e12; --chip:#22303a; --danger:#f97066; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1519; --panel:#172026; --ink:#e3eaee; --muted:#93a3ad; --line:#2a363e;
  --accent:#3cc4b4; --accent-ink:#06201d; --accent-soft:#16332f; --hit:#4a3e12; --chip:#22303a; --danger:#f97066; color-scheme:dark}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--f-body);display:flex;flex-direction:column;-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
img{max-width:100%}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* login */
.login{flex:1;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.lcard{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:28px 24px;display:flex;flex-direction:column;gap:14px;box-sizing:border-box}
.lcard h1{font:700 26px/1.05 var(--f-display);text-transform:uppercase;letter-spacing:.02em;margin:0}
.lcard .kicker{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:600}
.lcard p{margin:0;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12px;font-weight:600;letter-spacing:.04em;color:var(--muted)}
.field input{padding:11px 12px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit;font-size:16px}
.field input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.btn{border:0;background:var(--accent);color:var(--accent-ink);border-radius:6px;padding:12px;font-weight:600;font-size:15px}
.btn[disabled]{opacity:.6}
.err{color:var(--danger);font-size:13px;min-height:1em}
.lfoot{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted)}

/* top bar */
.top{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap;padding-top:calc(10px + env(safe-area-inset-top,0px))}
.brand{display:flex;flex-direction:column;line-height:1.05;min-width:0;background:none;border:0;padding:0;text-align:left}
.brand b{font:700 20px/1 var(--f-display);letter-spacing:.02em;text-transform:uppercase}
.brand span{font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.search{flex:1 1 280px;position:relative;min-width:0}
.search input{width:100%;box-sizing:border-box;padding:10px 12px 10px 36px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit;font-size:16px}
.search input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
.tright{display:flex;gap:8px;align-items:center}
.lang{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.lang button{border:0;background:transparent;padding:8px 12px;font-weight:600;font-size:13px;letter-spacing:.05em}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.ibtn{border:1px solid var(--line);background:transparent;border-radius:6px;padding:7px 10px;font-size:13px;display:inline-flex;gap:6px;align-items:center}
.who{font-size:12px;color:var(--muted);white-space:nowrap}
.menuBtn{display:none}

.wrap{flex:1;display:flex;min-height:0}
nav{width:290px;flex:none;overflow:auto;background:var(--panel);border-right:1px solid var(--line);padding:8px 0 24px}
.sys{border-bottom:1px solid var(--line)}
.sys>button{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px;border:0;background:transparent;padding:11px 16px;text-align:left;font:600 15px/1.2 var(--f-display);letter-spacing:.04em;text-transform:uppercase}
.sys>button small{font:500 11px var(--f-mono);color:var(--muted)}
.sys>button .chev{transition:transform .15s}
.sys.open>button .chev{transform:rotate(90deg)}
.sys ul{list-style:none;margin:0;padding:0 0 8px;display:none}
.sys.open ul{display:block}
.sys li button{width:100%;border:0;background:transparent;text-align:left;padding:7px 16px 7px 28px;display:flex;gap:8px;justify-content:space-between;color:var(--ink);font-size:13.5px}
.sys li button:hover{background:var(--bg)}
.sys li button[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600;box-shadow:inset 3px 0 0 var(--accent)}
.sys li small{font:12px var(--f-mono);color:var(--muted);flex:none}
.scrim{display:none}

main{flex:1;min-width:0;overflow:auto;padding-block:20px 40px;padding-inline:24px;scroll-behavior:smooth}
h1{font:700 28px/1.1 var(--f-display);margin:0;text-wrap:balance;letter-spacing:.01em}
h2{font:600 18px/1.2 var(--f-display);margin:0;letter-spacing:.03em;text-transform:uppercase}
.crumb{font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.crumb button{border:0;background:none;padding:0;color:var(--accent);font-size:inherit;letter-spacing:inherit;text-transform:inherit}
.sub{color:var(--muted);margin-top:4px}
.head{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}

/* home */
.sysGrid{display:flex;flex-direction:column;gap:28px}
.groupGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin-top:10px}
.gcard{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:0;text-align:left;display:flex;flex-direction:column;overflow:hidden}
.gcard:hover{border-color:var(--accent)}
.th{background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden}
.gcard .th{aspect-ratio:3/2;border-bottom:1px solid var(--line);max-width:100%}
.th img{max-height:100%;max-width:100%;object-fit:contain}
.gcard .cap{padding:8px 10px;display:flex;flex-direction:column;gap:2px}
.gcard .cap b{font-weight:600;font-size:13.5px;line-height:1.25}
.gcard .cap span{font:12px var(--f-mono);color:var(--muted)}
.sysHead{display:flex;align-items:baseline;gap:10px;border-bottom:2px solid var(--ink);padding-bottom:6px}
.sysHead small{font:12px var(--f-mono);color:var(--muted)}

/* group view */
.tabs{display:none}
.gv{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:20px;align-items:start}
.diagram{background:#fff;border:1px solid var(--line);border-radius:6px;position:sticky;top:0;overflow:hidden;display:flex;flex-direction:column}
.stage{overflow:auto;max-height:72vh;-webkit-overflow-scrolling:touch}
.canvas{position:relative;width:100%}
.canvas img{display:block;width:100%;height:auto;max-width:none}
.spot{position:absolute;border:0;padding:0;background:transparent;border-radius:5px;min-width:18px;min-height:18px}
.spot::after{content:"";position:absolute;inset:0;border-radius:5px;border:2px solid transparent;transition:background .15s,border-color .15s}
.spot:hover::after{border-color:#0a7d74;background:rgba(10,125,116,.12)}
.spot.on::after{border-color:#e8590c;background:rgba(232,89,12,.22);animation:pulse 1s ease-out 2}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(232,89,12,.6)}100%{box-shadow:0 0 0 12px rgba(232,89,12,0)}}
.dtools{display:flex;gap:6px;align-items:center;justify-content:space-between;padding:6px 8px;border-top:1px solid #d5dce1;background:#f5f7f8;color:#38454e;font-size:12px}
.dtools .grp{display:flex;gap:4px}
.dtools button{border:1px solid #c7d0d6;background:#fff;color:#152028;border-radius:4px;min-width:32px;height:30px;font-weight:600}
.diagram.full{position:fixed;inset:0;z-index:40;border-radius:0;border:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.diagram.full .stage{max-height:none;flex:1}
.tablebox{border:1px solid var(--line);border-radius:6px;background:var(--panel);overflow-x:auto;min-width:0}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th{font:600 11px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);background:var(--panel)}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top;scroll-margin:80px}
tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--bg)}
tbody tr.sel td{background:var(--hit)}
.ref{font:600 13px var(--f-mono);display:inline-flex;min-width:26px;height:22px;align-items:center;justify-content:center;border:1.5px solid var(--ink);border-radius:50%;padding:0 4px;box-sizing:border-box;background:transparent}
.ref.has:hover{border-color:var(--accent);color:var(--accent)}
.pn{font:500 13px var(--f-mono);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.copy{border:1px solid var(--line);background:transparent;border-radius:4px;padding:1px 5px;font-size:11px;color:var(--muted)}
.copy:hover{color:var(--accent);border-color:var(--accent)}
.nm{min-width:170px}
.nm b{font-weight:500;display:block}
.nm small{color:var(--muted);font-size:12px;display:block}
.q{text-align:center;font-family:var(--f-mono)}
.chip{display:inline-block;background:var(--chip);border-radius:3px;padding:1px 6px;font:500 11.5px var(--f-mono);white-space:nowrap}
mark{background:var(--hit);color:inherit;border-radius:2px}

/* search results */
.res{display:flex;flex-direction:column;gap:8px}
.ritem{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:12px;align-items:center;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:8px;text-align:left;width:100%}
.ritem:hover{border-color:var(--accent)}
.ritem .th{width:96px;height:64px;border-radius:4px}
.ritem .meta{font-size:12px;color:var(--muted)}
.empty{padding:40px 0;color:var(--muted)}
.gnav{display:flex;gap:8px;margin-top:16px;justify-content:space-between;flex-wrap:wrap}
.gnav button{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:8px 12px;max-width:48%;text-align:left;font-size:13px}
.loading{padding:60px 0;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:6px;font-size:13px;z-index:60}

@media (max-width:980px){
  .gv{grid-template-columns:minmax(0,1fr)}
  .diagram{position:static}
  .tabs{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-bottom:12px;background:var(--panel);position:sticky;top:-20px;z-index:5}
  .tabs button{flex:1;border:0;background:transparent;padding:10px;font-weight:600;font-size:14px}
  .tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
  .gv[data-tab="draw"] .tpane{display:none}
  .gv[data-tab="parts"] .diagram{display:none}
  .gv[data-tab="parts"] .diagram.full{display:flex}
  .stage{max-height:62vh}
}
@media (max-width:600px){
  .tablebox{overflow:visible}
  thead{display:none}
  tbody tr{display:grid;grid-template-columns:40px minmax(0,1fr) 34px;grid-template-areas:"r n q" "r p q" "r m m";border-bottom:1px solid var(--line);padding:8px 10px;column-gap:8px;row-gap:3px}
  tbody tr:last-child{border-bottom:0}
  tbody td{padding:0;border:0;background:transparent!important}
  tbody tr.sel{background:var(--hit)}
  tbody td:nth-child(1){grid-area:r}
  tbody td.nm{grid-area:n;min-width:0}
  tbody td:nth-child(2){grid-area:p}
  tbody td.q{grid-area:q;text-align:right}
  tbody td:nth-child(5){grid-area:m}
  tbody td:nth-child(5):empty{display:none}
}
@media (max-width:760px){
  .menuBtn{display:inline-flex}
  .search{order:3;flex-basis:100%}
  .tright{margin-left:auto}
  .who{display:none}
  nav{position:fixed;z-index:35;top:0;bottom:0;left:0;width:min(86vw,320px);transform:translateX(-102%);transition:transform .2s;box-shadow:0 0 40px rgba(0,0,0,.25);padding-top:env(safe-area-inset-top,0px)}
  nav.show{transform:none}
  nav.show+.scrim{display:block;position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.3)}
  main{padding-inline:16px}
  h1{font-size:23px}
  .ritem{grid-template-columns:72px minmax(0,1fr)}
  .ritem .th{width:72px;height:52px}
  .ritem .pn{grid-column:2}
  .brand b{font-size:18px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}main{scroll-behavior:auto}}
</style>
</head>
<body>


<section class="login" id="loginView" hidden>
  <form class="lcard" id="loginForm" novalidate>
    <span class="kicker">Inter Cargo Grup</span>
    <h1>Cavan C1 · C1 Plus</h1>
    <p id="lSub">Catalog piese de schimb. Autentifică-te ca să continui.</p>
    <div class="field"><label for="lu" id="lUL">Utilizator</label><input id="lu" autocomplete="username" autocapitalize="none" spellcheck="false" required></div>
    <div class="field"><label for="lp" id="lPL">Parolă</label><input id="lp" type="password" autocomplete="current-password" required></div>
    <div class="err" id="lErr" role="alert"></div>
    <button class="btn" id="lBtn" type="submit">Intră în catalog</button>
    <div class="lfoot"><span id="lHelp">Cont nou: cere-l administratorului.</span>
      <div class="lang" role="group"><button type="button" data-l="ro">RO</button><button type="button" data-l="en">EN</button></div></div>
  </form>
</section>

<div id="appView" hidden style="display:contents">
<header class="top">
  <button class="ibtn menuBtn" id="menuBtn" aria-label="Grupe"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
  <button class="brand" id="homeBtn"><b>Cavan C1 · C1 Plus</b><span id="tagline">Catalog piese de schimb</span></button>
  <label class="search" for="q">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" autocomplete="off" enterkeyhint="search">
  </label>
  <div class="tright">
    <span class="who" id="who"></span>
    <div class="lang" role="group"><button data-l="ro">RO</button><button data-l="en">EN</button></div>
    <button class="ibtn" id="logoutBtn" hidden title=""><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h11"/></svg><span id="logoutL"></span></button>
  </div>
</header>
<div class="wrap">
  <nav id="nav"></nav><div class="scrim" id="scrim"></div>
  <main id="main"><div class="loading">…</div></main>
</div>
</div>
<div class="toast" id="toast" hidden></div>

<script src="config.js"></script>
<script>
const T={
 ro:{tag:"Catalog piese de schimb",ph:"Caută denumire sau cod piesă (ex: amortizor, X1356…)",home:"Toate grupele",ref:"Poz.",pn:"Cod piesă",name:"Denumire",qty:"Buc.",rem:"Observații",parts:"poziții",groups:"grupe",res:"rezultate pentru",none:"Nicio piesă găsită. Încearcă alt termen sau o parte din cod.",copy:"Copiază",copied:"Cod copiat",tip:"Apasă pe un număr de pe desen ca să vezi piesa",prev:"‹ Anterior",next:"Următor ›",intro:"Alege un sistem, apoi grupa. Fiecare grupă are desenul explodat și lista de piese; numerele de pe desen te duc direct la piesă.",fig:"Fig.",all:"piese în catalog",tDraw:"Desen",tParts:"Piese",fit:"Potrivește",full:"Ecran complet",nospot:"Poziția nu e marcată pe desen",
  lSub:"Catalog piese de schimb. Autentifică-te ca să continui.",lU:"Utilizator",lP:"Parolă",lB:"Intră în catalog",lHelp:"Cont nou: cere-l administratorului.",eBad:"Utilizator sau parolă greșită.",eInactive:"Contul este dezactivat. Contactează administratorul.",eNet:"Nu există conexiune la server. Verifică internetul și încearcă din nou.",eCfg:"Aplicația nu are setat serverul de autentificare (config.js).",eData:"Catalogul nu a putut fi deschis. Încearcă din nou cu internet.",out:"Ieșire",loading:"Se încarcă catalogul…",expired:"Sesiunea a expirat. Autentifică-te din nou."},
 en:{tag:"Spare parts catalogue",ph:"Search part name or number (e.g. shock absorber, X1356…)",home:"All groups",ref:"Ref.",pn:"Part No.",name:"Part name",qty:"Qty",rem:"Remarks",parts:"items",groups:"groups",res:"results for",none:"No parts found. Try another term or part of the number.",copy:"Copy",copied:"Part number copied",tip:"Tap a number on the drawing to jump to the part",prev:"‹ Previous",next:"Next ›",intro:"Pick a system, then a group. Each group shows the exploded view and the parts list; the numbers on the drawing take you to the part.",fig:"Fig.",all:"parts in catalogue",tDraw:"Drawing",tParts:"Parts",fit:"Fit",full:"Full screen",nospot:"Reference not marked on the drawing",

};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fold=s=>String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const pnk=s=>fold(s).replace(/[^a-z0-9]/g,'');
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
let lang=store.get('cvlang')||'ro';
let DATA=null,systems=[],bySys={},INDEX=[],total=0,cur=null,openSys=new Set(),zoom=1,tab='draw';

function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,1600)}

function init(data){
  DATA=data;systems=[];bySys={};INDEX=[];
  DATA.forEach((g,i)=>{g.i=i;if(!bySys[g.sys_en]){bySys[g.sys_en]={en:g.sys_en,ro:g.sys_ro,groups:[]};systems.push(bySys[g.sys_en])}bySys[g.sys_en].groups.push(g)});
  DATA.forEach(g=>g.items.forEach((it,k)=>INDEX.push({g,it,k,txt:fold([it.ro,it.en,it.cn,g.ro,g.en].join(' ')),pk:pnk(it.pn)})));
  total=INDEX.length;openSys=new Set([systems[0].en]);
}
const gName=g=>lang==='ro'?g.ro:g.en, sName=s=>lang==='ro'?s.ro:s.en;
const pName=it=>lang==='ro'?it.ro:it.en, pAlt=it=>lang==='ro'?it.en:it.ro;

/* images: plain in preview, encrypted in the installed app */
function imgTag(name,alt,cls){return `<img ${cls?`class="${cls}"`:''} data-img="${name}" alt="${esc(alt||'')}">`}
function hydrate(root){root.querySelectorAll('img[data-img]:not([src])').forEach(el=>{ASSETS.img(el.dataset.img).then(u=>{el.src=u}).catch(()=>{})})}

function nav(){
  $('#nav').innerHTML=systems.map(s=>`<div class="sys ${openSys.has(s.en)?'open':''}" data-s="${esc(s.en)}">
   <button aria-expanded="${openSys.has(s.en)}"><span>${esc(sName(s))}</span><span style="display:flex;gap:8px;align-items:center"><small>${s.groups.length}</small><svg class="chev" width="10" height="10" viewBox="0 0 10 10"><path d="M3 1l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></span></button>
   <ul>${s.groups.map(g=>`<li><button data-g="${g.id}" ${cur===g?'aria-current="true"':''}><span>${esc(gName(g))}</span><small>${g.items.length}</small></button></li>`).join('')}</ul></div>`).join('');
}
$('#nav').addEventListener('click',e=>{
  const gb=e.target.closest('[data-g]');
  if(gb){$('#q').value='';go(gb.dataset.g);closeNav();return}
  const sb=e.target.closest('.sys>button');
  if(sb){const k=sb.parentNode.dataset.s;openSys.has(k)?openSys.delete(k):openSys.add(k);nav()}
});
function closeNav(){$('#nav').classList.remove('show')}
$('#scrim').onclick=closeNav;

function hl(text,q){
  if(!q)return esc(text);
  const words=fold(q).split(/\s+/).filter(w=>w.length>1);if(!words.length)return esc(text);
  const f=fold(text);let marks=[];
  words.forEach(w=>{let i=f.indexOf(w);while(i>-1){marks.push([i,i+w.length]);i=f.indexOf(w,i+1)}});
  if(!marks.length)return esc(text);
  marks.sort((a,b)=>a[0]-b[0]);let out='',p=0;
  marks.forEach(([a,b])=>{if(a<p)return;out+=esc(text.slice(p,a))+'<mark>'+esc(text.slice(a,b))+'</mark>';p=b});
  return out+esc(text.slice(p));
}

function home(){
  cur=null;const t=T[lang];
  $('#main').innerHTML=`<div class="head"><h1>${t.tag}</h1><p class="sub" style="max-width:65ch">${t.intro} <span style="font-family:var(--f-mono);font-size:12px">${DATA.length} ${t.groups} · ${total} ${t.all}</span></p></div>
  <div class="sysGrid">${systems.map(s=>`<section><div class="sysHead"><h2>${esc(sName(s))}</h2><small>${s.groups.length} ${t.groups}</small></div>
  <div class="groupGrid">${s.groups.map(g=>`<button class="gcard" data-go="${g.id}"><div class="th">${imgTag('t'+g.id.slice(1),'')}</div><div class="cap"><b>${esc(gName(g))}</b><span>${t.fig} ${g.page} · ${g.items.length} ${t.parts}</span></div></button>`).join('')}</div></section>`).join('')}</div>`;
  nav();lazy();$('#main').scrollTop=0;setHash('');
}
let io=null;
function lazy(){
  if(io)io.disconnect();
  io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){const el=e.target;io.unobserve(el);ASSETS.img(el.dataset.img).then(u=>el.src=u).catch(()=>{})}}),{root:$('#main'),rootMargin:'400px'});
  document.querySelectorAll('#main img[data-img]:not([src])').forEach(el=>io.observe(el));
}

function group(g,selK){
  cur=g;openSys.add(g.sys_en);const t=T[lang];const s=bySys[g.sys_en];
  const prev=DATA[g.i-1],next=DATA[g.i+1];
  const spotRefs=new Set((g.spots||[]).flatMap(p=>p.r));
  const rows=g.items.map((it,k)=>`<tr data-k="${k}" data-r="${esc(it.r)}" class="${k===selK?'sel':''}"><td><button class="ref ${spotRefs.has(it.r)?'has':''}" data-show="${esc(it.r)}" title="${spotRefs.has(it.r)?t.tDraw:t.nospot}">${esc(it.r)}</button></td>
   <td><span class="pn">${esc(it.pn)}<button class="copy" data-c="${esc(it.pn)}">${t.copy}</button></span></td>
   <td class="nm"><b>${esc(pName(it))}</b><small>${esc(pAlt(it))}</small></td>
   <td class="q">${esc(it.q)}</td><td>${it.rm?`<span class="chip">${esc(it.rm)}</span>`:''}</td></tr>`).join('');
  const spots=(g.spots||[]).map((p,i)=>`<button class="spot" data-spot="${i}" data-refs="${p.r.join(',')}" style="left:${(p.x-0.7).toFixed(2)}%;top:${(p.y-0.9).toFixed(2)}%;width:${(p.w+1.4).toFixed(2)}%;height:${(p.h+1.8).toFixed(2)}%" aria-label="${t.ref} ${p.r.join('+')}"></button>`).join('');
  if(selK!=null)tab='parts';else if(window.innerWidth<=980)tab='draw';
  $('#main').innerHTML=`<div class="head"><div class="crumb"><button data-home>${t.home}</button><span>/</span><span>${esc(sName(s))}</span></div>
   <h1>${esc(gName(g))}</h1><div class="sub">${esc(lang==='ro'?g.en:g.ro)} · <span lang="zh">${esc(g.cn)}</span> · ${t.fig} ${g.page}</div></div>
   <div class="tabs" role="tablist"><button role="tab" data-tab="draw" aria-selected="${tab==='draw'}">${t.tDraw}</button><button role="tab" data-tab="parts" aria-selected="${tab==='parts'}">${t.tParts} (${g.items.length})</button></div>
   <div class="gv" data-tab="${tab}"><div class="diagram" id="diagram"><div class="stage" id="stage"><div class="canvas" id="canvas">${imgTag(g.id,gName(g),'dimg')}${spots}</div></div>
   <div class="dtools"><span id="dtip">${t.tip}</span><span class="grp"><button data-z="-" aria-label="−">−</button><button data-z="0" title="${t.fit}">1:1</button><button data-z="+" aria-label="+">+</button><button data-z="f" title="${t.full}">⤢</button></span></div></div>
   <div class="tpane" style="min-width:0"><div class="tablebox"><table><thead><tr><th>${t.ref}</th><th>${t.pn}</th><th>${t.name}</th><th class="q">${t.qty}</th><th>${t.rem}</th></tr></thead><tbody>${rows}</tbody></table></div>
   <div class="gnav">${prev?`<button data-go="${prev.id}">${t.prev}<br><small>${esc(gName(prev))}</small></button>`:'<span></span>'}${next?`<button data-go="${next.id}" style="text-align:right">${t.next}<br><small>${esc(gName(next))}</small></button>`:''}</div></div></div>`;
  zoom=1;nav();hydrate($('#main'));
  const a=$('#nav [aria-current="true"]');if(a)a.scrollIntoView({block:'nearest'});
  $('#main').scrollTop=0;
  if(selK!=null){const r=$(`tr[data-k="${selK}"]`);if(r){markSpots(g.items[selK].r);setTimeout(()=>r.scrollIntoView({block:'center'}),60)}}
  setHash(g.id);
}
function setTab(v){tab=v;const gv=$('.gv');if(gv)gv.dataset.tab=v;document.querySelectorAll('.tabs [data-tab]').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===v))}
function markSpots(r){document.querySelectorAll('.spot').forEach(s=>s.classList.toggle('on',s.dataset.refs.split(',').includes(r)))}
function selectRef(r){
  const rows=[...document.querySelectorAll(`tbody tr`)].filter(tr=>tr.dataset.r===r);
  document.querySelectorAll('tbody tr.sel').forEach(x=>x.classList.remove('sel'));
  rows.forEach(x=>x.classList.add('sel'));
  return rows;
}
function setZoom(z){zoom=Math.max(1,Math.min(5,z));const c=$('#canvas');if(c)c.style.width=(zoom*100)+'%'}

function search(q){
  const t=T[lang];const words=fold(q).split(/\s+/).filter(Boolean);const qp=pnk(q);
  let hits=INDEX.filter(x=>(qp.length>=3&&x.pk.includes(qp))||words.every(w=>x.txt.includes(w)||(pnk(w).length>=3&&x.pk.includes(pnk(w)))));
  hits.sort((a,b)=>(b.pk.startsWith(qp)&&qp.length>=3)-(a.pk.startsWith(qp)&&qp.length>=3)||a.g.i-b.g.i);
  const shown=hits.slice(0,300);
  $('#main').innerHTML=`<div class="head"><div class="crumb"><button data-home>${t.home}</button></div><h1>${hits.length} ${t.res} „${esc(q)}”</h1></div>
   ${hits.length?`<div class="res">${shown.map(x=>`<button class="ritem" data-go="${x.g.id}" data-k="${x.k}"><div class="th">${imgTag('t'+x.g.id.slice(1),'')}</div>
   <div style="min-width:0"><div><b>${hl(pName(x.it),q)}</b></div><div class="meta">${hl(pAlt(x.it),q)}</div><div class="meta">${esc(sName(bySys[x.g.sys_en]))} › ${esc(gName(x.g))} · ${t.ref} <b>${esc(x.it.r)}</b>${x.it.rm?' · <span class="chip">'+esc(x.it.rm)+'</span>':''}</div></div>
   <span class="pn">${hl(x.it.pn,q.replace(/\s/g,''))}</span></button>`).join('')}</div>`:`<p class="empty">${t.none}</p>`}`;
  cur=null;nav();lazy();$('#main').scrollTop=0;
}

$('#main').addEventListener('click',e=>{
  const t=T[lang];
  const c=e.target.closest('.copy');
  if(c){e.stopPropagation();const v=c.dataset.c;
    try{navigator.clipboard.writeText(v).then(()=>toast(t.copied+': '+v),()=>selText(c))}catch(_){selText(c)}return}
  if(e.target.closest('[data-home]')){$('#q').value='';home();return}
  const sp=e.target.closest('.spot');
  if(sp){
    const refs=sp.dataset.refs.split(',');
    document.querySelectorAll('.spot.on').forEach(x=>x.classList.remove('on'));sp.classList.add('on');
    const rows=refs.flatMap(r=>selectRef(r)).filter(Boolean);
    document.querySelectorAll('tbody tr').forEach(tr=>tr.classList.toggle('sel',refs.includes(tr.dataset.r)));
    const d=$('#diagram');if(d.classList.contains('full'))d.classList.remove('full');
    if(window.innerWidth<=980)setTab('parts');
    const first=document.querySelector('tbody tr.sel');
    if(first)setTimeout(()=>first.scrollIntoView({block:'center',behavior:'smooth'}),30);
    return}
  const show=e.target.closest('[data-show]');
  if(show){e.stopPropagation();const r=show.dataset.show;selectRef(r);
    const has=[...document.querySelectorAll('.spot')].filter(s=>s.dataset.refs.split(',').includes(r));
    if(!has.length){toast(t.nospot);return}
    if(window.innerWidth<=980)setTab('draw');
    markSpots(r);setTimeout(()=>{const st=$('#stage'),s0=has[0];st.scrollTo({left:s0.offsetLeft-st.clientWidth/2,top:s0.offsetTop-st.clientHeight/2,behavior:'smooth'});
      if(window.innerWidth<=980)$('#diagram').scrollIntoView({block:'start'})},40);
    return}
  const tb=e.target.closest('.tabs [data-tab]');if(tb){setTab(tb.dataset.tab);return}
  const z=e.target.closest('[data-z]');
  if(z){const v=z.dataset.z;if(v==='+')setZoom(zoom*1.5);else if(v==='-')setZoom(zoom/1.5);else if(v==='0')setZoom(1);else{$('#diagram').classList.toggle('full')}return}
  const go_=e.target.closest('[data-go]');
  if(go_){const k=go_.dataset.k;if(k!=null)$('#q').value='';go(go_.dataset.go,k!=null?+k:null);return}
  const tr=e.target.closest('tbody tr');
  if(tr){document.querySelectorAll('tbody tr.sel').forEach(r=>r.classList.remove('sel'));tr.classList.add('sel');markSpots(tr.dataset.r)}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){const d=$('#diagram');if(d)d.classList.remove('full');closeNav()}});
function selText(c){const r=document.createRange();r.selectNodeContents(c.parentNode.firstChild);const s=getSelection();s.removeAllRanges();s.addRange(r)}
function go(id,k){const g=DATA.find(x=>x.id===id);if(g)group(g,k)}
function setHash(h){try{history.replaceState(null,'',h?'#'+h:location.pathname+location.search)}catch(e){}}

let tmr;$('#q').addEventListener('input',e=>{clearTimeout(tmr);const v=e.target.value.trim();tmr=setTimeout(()=>v.length>=2?search(v):(cur?group(cur):home()),180)});
$('#homeBtn').onclick=()=>{$('#q').value='';home()};
$('#menuBtn').onclick=()=>$('#nav').classList.toggle('show');
function applyLang(){
  const t=T[lang];document.documentElement.lang=lang;store.set('cvlang',lang);
  document.querySelectorAll('[data-l]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===lang));
  $('#q').placeholder=t.ph;$('#tagline').textContent=t.tag;$('#logoutL').textContent=t.out;
  $('#lSub').textContent=t.lSub;$('#lUL').textContent=t.lU;$('#lPL').textContent=t.lP;$('#lBtn').textContent=t.lB;$('#lHelp').textContent=t.lHelp;
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-l]');if(!b)return;lang=b.dataset.l;applyLang();
  if(!DATA)return;const q=$('#q').value.trim();if(q.length>=2)search(q);else if(cur){const s=$('tbody tr.sel');group(cur,s?+s.dataset.k:null)}else home()});

window.addEventListener('hashchange',()=>{if(!DATA)return;const h=(location.hash||'').slice(1);if(h&&(!cur||cur.id!==h)&&DATA.find(x=>x.id===h))go(h)});
function startCatalog(data,name){
  init(data);$('#loginView').hidden=true;$('#appView').hidden=false;
  if(name){$('#who').textContent=name;$('#logoutBtn').hidden=false}
  applyLang();
  const h=(location.hash||'').slice(1);
  if(h&&DATA.find(x=>x.id===h))go(h);else home();
}
applyLang();
</script>
<script>
let KEY=null;const imgCache=new Map();
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function dec(buf){const u=new Uint8Array(buf);return crypto.subtle.decrypt({name:'AES-GCM',iv:u.slice(0,12)},KEY,u.slice(12))}
const ASSETS={img(n){
  if(imgCache.has(n))return imgCache.get(n);
  const p=fetch('data/img/'+n+'.bin').then(r=>{if(!r.ok)throw new Error(r.status);return r.arrayBuffer()}).then(dec).then(d=>URL.createObjectURL(new Blob([d],{type:'image/webp'})));
  imgCache.set(n,p);p.catch(()=>imgCache.delete(n));return p}};
const SK='cvsess';
function getSess(){try{return JSON.parse(store.get(SK)||'null')}catch(e){return null}}
async function openCatalog(sess){
  KEY=await crypto.subtle.importKey('raw',b64(sess.key),'AES-GCM',false,['decrypt']);
  const r=await fetch('data/catalog.bin');if(!r.ok)throw new Error('data');
  const d=await dec(await r.arrayBuffer());
  startCatalog(JSON.parse(new TextDecoder().decode(d)),sess.name);
}
function showLogin(msg){
  $('#appView').hidden=true;$('#loginView').hidden=false;$('#lErr').textContent=msg||'';
  setTimeout(()=>$('#lu').focus(),50);
}
function logout(msg){store.del(SK);KEY=null;DATA=null;imgCache.clear();$('#q').value='';setHash('');showLogin(msg)}
$('#logoutBtn').onclick=()=>logout('');
async function api(body){
  if(!window.API_URL||/PUNE_AICI/.test(API_URL))throw new Error('cfg');
  const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)});
  return r.json();
}
$('#loginForm').addEventListener('submit',async e=>{
  e.preventDefault();const t=T[lang];const btn=$('#lBtn');
  const u=$('#lu').value.trim(),p=$('#lp').value;if(!u||!p)return;
  btn.disabled=true;btn.textContent=t.loading;$('#lErr').textContent='';
  try{
    const res=await api({action:'login',u,p});
    if(!res.ok){$('#lErr').textContent=res.error==='inactive'?t.eInactive:t.eBad;return}
    const sess={user:res.user,name:res.name,key:res.key,exp:res.exp,token:res.token};
    store.set(SK,JSON.stringify(sess));$('#lp').value='';
    try{await openCatalog(sess)}catch(err){logout(t.eData)}
  }catch(err){$('#lErr').textContent=err.message==='cfg'?t.eCfg:t.eNet}
  finally{btn.disabled=false;btn.textContent=t.lB}
});
(async function boot(){
  if('serviceWorker' in navigator){try{navigator.serviceWorker.register('sw.js')}catch(e){}}
  const s=getSess();
  if(!s||!s.key||!(s.exp>Date.now())){if(s)store.del(SK);showLogin(s?T[lang].expired:'');return}
  try{await openCatalog(s)}catch(e){logout(T[lang].eData);return}
  if(navigator.onLine){try{const r=await api({action:'check',token:s.token});
    if(!r.ok&&['inactive','invalid','expired'].includes(r.error))logout(r.error==='inactive'?T[lang].eInactive:T[lang].expired)}catch(e){}}
})();
</script>
